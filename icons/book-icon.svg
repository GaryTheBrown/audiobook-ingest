<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Vivid High-Performance Gradient for Main Accents -->
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff9000" />
            <stop offset="100%" stop-color="#ff5500" />
        </linearGradient>
    </defs>
    
    <!-- Premium Dark Theme Squircle Base Container Layer -->
    <rect width="512" height="512" rx="190" fill="#000000" />
    <rect x="4" y="4" width="504" height="504" rx="190" fill="none" stroke="url(#brandGrad)" stroke-width="8" />

    <!-- 1. THE AUTOMATED CONVERSION LOOP (Clockwise Chasing Logic Arrows) -->
    <g fill="none" stroke-linecap="round" stroke-width="24">
        <!-- Top-Right Dynamic Processing Track -->
        <path d="M 256 70 A 186 186 0 0 1 426 310" stroke="url(#brandGrad)" />
        <!-- Bottom-Left Dynamic Processing Track -->
        <path d="M 256 442 A 186 186 0 0 1 86 202" stroke="url(#brandGrad)" />

    </g>

    <!-- 2. HIGH-VISIBILITY FORMAT INDICATOR TYPOGRAPHY -->
    <!-- Crisp, modern, heavy geometric block letter layout -->
    <text x="256" y="296" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="124" 
          letter-spacing="-2px"
          text-anchor="middle" 
          fill="url(#brandGrad)">ePUB</text>

    <!-- 3. KINETIC PROCESSING DECORATORS (Input dots translating to structural container) -->
    <circle cx="160" cy="340" r="10" fill="url(#brandGrad)" opacity="0.4" />
    <circle cx="190" cy="350" r="12" fill="url(#brandGrad)" opacity="0.7" />
    <circle cx="225" cy="355" r="14" fill="url(#brandGrad)" />
</svg>
